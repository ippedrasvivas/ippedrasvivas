<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">

    <title>{% if page.title %}{{ page.title }} · {% endif %}Igreja Presbiteriana Pedras Vivas</title>

    <link rel="icon" type="image/png" href="/img/ippv-logo-2026.png">

    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}Igreja Presbiteriana Pedras Vivas">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ site.url }}/img/ippv-logo-2026.png">

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Brand Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Site CSS -->
    <link rel="stylesheet" href="css/main.css">

    <style>
    header {
        background-image: url({% if page.headerimg %} {{page.headerimg}} {% else %} img/stones.jpg {% endif %});
    }
    </style>
</head>
