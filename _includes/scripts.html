<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function () {
  // Navbar scroll class
  var nav = document.getElementById('mainNav');
  if (nav) {
    function onScroll() {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // Smooth scroll for page-scroll links (handles both #anchor and /#anchor)
  document.querySelectorAll('a.page-scroll').forEach(function (link) {
    link.addEventListener('click', function (e) {
      var href = this.getAttribute('href');
      var anchor = href && href.startsWith('/#') ? href.slice(1) : href;
      if (anchor && anchor.startsWith('#')) {
        var target = document.querySelector(anchor);
        if (target) {
          e.preventDefault();
          var navHeight = nav ? nav.offsetHeight : 0;
          window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - navHeight, behavior: 'smooth' });
        }
        // target not on this page — let browser navigate normally to /#anchor
      }
    });
  });

  // Intersection Observer for .animate-in elements
  var animEls = document.querySelectorAll('.animate-in');
  if (animEls.length && 'IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    animEls.forEach(function (el) { observer.observe(el); });
  } else {
    animEls.forEach(function (el) { el.classList.add('visible'); });
  }
})();
</script>
