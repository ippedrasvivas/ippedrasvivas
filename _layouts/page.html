<!DOCTYPE html>
<html lang="pt-BR">

{% include head.html %}

<body id="page-top">
    {% include nav.html %}
    <header class="header-page">
        <div class="header-content">
            {% if page.title %}
            <div class="header-content-inner">
                <h1>{{ page.title }}</h1>
                <hr>
                {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
            </div>
            {% endif %}
        </div>
    </header>

    <section>
        <div class="container">
            <div class="row">
                <div class="col-12 page-content{% if page.wide %} page-content-wide{% endif %}">
                    {{content | markdownify}}
                </div>
            </div>
        </div>
    </section>

    {% include footer.html %}
    {% include scripts.html %}
</body>

</html>
